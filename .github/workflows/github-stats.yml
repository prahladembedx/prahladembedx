name: Update GitHub Stats

on:
  schedule:
    - cron: "0 */12 * * *"      # every 12 hours
  workflow_dispatch:             # lets you run it manually from the Actions tab
  push:
    paths:
      - "scripts/generate_stats.py"
      - ".github/workflows/github-stats.yml"

permissions:
  contents: write                # needed so the bot can commit the SVG

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate stats card
        run: python scripts/generate_stats.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: Commit updated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats/github-metrics.svg
          git diff --cached --quiet || git commit -m "chore: update GitHub stats card"
          git push
